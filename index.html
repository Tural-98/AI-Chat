.app{

.header{

.sub{

.chat{

.welcome{

.msg{

}

.msg.user{

}

.bubble{
    max-width:84%;
    padding:11px 13px;
    border-radius:17px;
    font-size:14px;
    line-height:1.48;

.bot .bubble{

}

.user .bubble{

}

.quick{

    gap:7px;
    overflow-x:auto;
    padding:7px 11px 10px;
    background:#f8f9f7;
}

.quick button{
    border:1px solid #d7dfd6;
    background:#fff;
    border-radius:22px;
    padding:9px 12px;
    white-space:nowrap;
    color:#304535;
    cursor:pointer;
}

.quick button:hover{
    background:#eef3ee;
}

.composer{
    display:flex;
    gap:8px;
    padding:9px 12px 14px;
    border-top:1px solid #e1e5e1;
    background:#fff;
}

.composer input{

    border-radius:24px;
    padding:12px 14px;
    outline:none;

.composer input:focus{

.send{

@media(min-width:600px){

function normalizeText(text){

    return text
        .toLowerCase()
        .trim()
        .replace(/ə/g,"e")
        .replace(/ı/g,"i")
        .replace(/ö/g,"o")
        .replace(/ü/g,"u")
        .replace(/ş/g,"s")
        .replace(/ç/g,"c")
        .replace(/ğ/g,"g")
        .replace(/İ/g,"i");

}

    bubble.className="bubble";

    bubble.textContent=text;

    wrap.appendChild(bubble);

    document.getElementById("chat").appendChild(wrap);

    document.getElementById("chat").scrollTop=999999;

}
